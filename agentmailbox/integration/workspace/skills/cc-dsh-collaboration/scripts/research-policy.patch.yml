# Fixed final overlay for public research. The zero-tool policy stays unchanged.
# Only DuckDuckGo search, native web_fetch, and fixed status-board tools may pass
# the separate host guard; no automatic workspace readers or runtime loaders.
- id: tools
  config:
    mode: native
- id: headless-runner
  inject: [headlessStartup, consultationPolicy]
- insert:
    - id: research-policy
      name: "__CONSULTATION_PLUGIN__"
      config:
        pluginSha256: "__CONSULTATION_PLUGIN_SHA256__"
        overlaySha256: "__CONSULTATION_OVERLAY_SHA256__"
        configSha256: "__CONSULTATION_CONFIG_SHA256__"
